<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Bikes - Bike4U</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>🏍️ Available Bikes</h1>
  <button id="backBtn" class="nav-button">⬅ Back to Add Bike</button>

  <div id="bikesContainer">
    <div class="table-wrapper">
      <table id="bikeTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Model</th>
            <th>Brand</th>
            <th>Type</th>
            <th>Price</th>
            <th>Image</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Bikes will be loaded here dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- ✏️ Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <h2>Edit Bike Details</h2>
      <form id="editForm">
        <input type="hidden" id="editId">
        <input type="text" id="editModel" placeholder="Model" required>
        <input type="text" id="editBrand" placeholder="Brand" required>
        <input type="text" id="editType" placeholder="Type" required>
        <input type="number" id="editPrice" placeholder="Price" required>
        <button type="submit" id="saveEditBtn">💾 Save Changes</button>
      </form>
    </div>
  </div>

  <script>
    // Navigate back to Add Bike page
    document.getElementById("backBtn").addEventListener("click", () => {
      window.location.href = "addbike.html";
    });

    // === Load Bikes ===
    async function loadBikes() {
      const tableBody = document.querySelector("#bikeTable tbody");
      try {
        const response = await fetch("http://localhost:8080/bike/getbike");
        if (!response.ok) throw new Error("Failed to fetch bikes");

        const bikes = await response.json();
        tableBody.innerHTML = "";

        if (bikes.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#ccc;">No bikes found.</td></tr>`;
          return;
        }

        bikes.forEach(bike => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${bike.id ?? ""}</td>
            <td>${bike.model ?? ""}</td>
            <td>${bike.brand ?? ""}</td>
            <td>${bike.type ?? ""}</td>
            <td>₹${bike.price ?? ""}</td>
            <td>${bike.image ? `<img src="data:image/jpeg;base64,${bike.image}" alt="${bike.model}"/>` : "No Image"}</td>
            <td>
              <button class="edit-btn" onclick='openEditModal(${JSON.stringify(bike)})'>✏️ Edit</button>
              <button class="delete-btn" onclick="deleteBike(${bike.id})">🗑️ Delete</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      } catch (error) {
        console.error(error);
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Error loading bikes</td></tr>`;
      }
    }

    // === DELETE Bike ===
    async function deleteBike(id) {
      const confirmDelete = confirm("Are you sure you want to delete this bike?");
      if (!confirmDelete) return;

      try {
        const response = await fetch(`http://localhost:8080/bike/${id}`, { method: "DELETE" });
        if (response.ok) {
          alert("🗑️ Bike deleted successfully!");
          loadBikes();
        } else {
          alert("❌ Failed to delete bike");
        }
      } catch (error) {
        console.error(error);
        alert("⚠️ Error deleting bike");
      }
    }

    // === OPEN EDIT MODAL ===
    function openEditModal(bike) {
      document.getElementById("editId").value = bike.id;
      document.getElementById("editModel").value = bike.model;
      document.getElementById("editBrand").value = bike.brand;
      document.getElementById("editType").value = bike.type;
      document.getElementById("editPrice").value = bike.price;

      document.getElementById("editModal").style.display = "flex";
    }

    // === CLOSE MODAL ===
    document.querySelector(".close-btn").addEventListener("click", () => {
      document.getElementById("editModal").style.display = "none";
    });

    // === SAVE CHANGES ===
    document.getElementById("editForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const id = document.getElementById("editId").value;
  const formData = new FormData();

  formData.append("model", document.getElementById("editModel").value);
  formData.append("brand", document.getElementById("editBrand").value);
  formData.append("price", document.getElementById("editPrice").value);
  formData.append("type", document.getElementById("editType").value);
  // You can also add image if you want to allow updating it later:
  // const imageFile = document.getElementById("editImage")?.files[0];
  // if (imageFile) formData.append("image", imageFile);

  try {
    const response = await fetch(`http://localhost:8080/bike/${id}`, {
      method: "PUT",
      body: formData, // ✅ Send formData directly, no headers
    });

    if (response.ok) {
      alert("✅ Bike updated successfully!");
      document.getElementById("editModal").style.display = "none";
      loadBikes();
    } else {
      alert("❌ Failed to update bike");
    }
  } catch (error) {
    console.error(error);
    alert("⚠️ Error updating bike");
  }
});

    // Load bikes initially
    window.onload = loadBikes;
  </script>

</body>
</html>
