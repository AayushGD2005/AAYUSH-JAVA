<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike4U - Login</title>
    <link rel="stylesheet" href="homepage.css">
</head>
<body class="home-body">

    <div class="login-container">
        <h2>Login</h2>
        <input type="text" id="userid" placeholder="User ID" required>
        <input type="password" id="password" placeholder="Password" required>
        <button id="loginBtn">Login</button>
    </div>

    <div class="dashboard" id="dashboard" style="display: none;">
        <h2>Welcome, <span id="usernameDisplay"></span>!</h2>
        <div id="adminButtons" style="display: none;">
            <button onclick="navigate('index.html')">Add Bike</button>
            <button onclick="navigate('viewbike.html')">View Bikes</button>
            <button onclick="navigate('editbike.html')">Edit Bike</button>
        </div>
        <div id="userButtons" style="display: none;">
            <button onclick="navigate('viewbike.html')">View Bikes</button>
        </div>
        <button onclick="logout()">Logout</button>
    </div>

    <script src="homepage.js"></script>
</body>
</html>
